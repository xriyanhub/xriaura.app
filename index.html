<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Web3 Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #12100e;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .user-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ffb703, #fb8500);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #12100e;
            font-size: 18px;
            border: 2px solid #ffb703;
        }

        .user-info h4 {
            font-size: 14px;
            color: #aaa;
        }

        .user-info h2 {
            font-size: 18px;
            font-weight: 900;
        }

        .balance-card {
            background: linear-gradient(145deg, #1b1713, #14110d);
            border: 1px solid #26221c;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .balance-card h3 {
            font-size: 13px;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 900;
            color: #ffb703;
            margin-bottom: 15px;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #14110d;
            border-top: 1px solid #26221c;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #777;
            font-size: 10px;
            gap: 4px;
            transition: 0.2s;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: #ffb703;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-box">
            <div class="avatar">XY</div>
            <div class="user-info">
                <h4>Welcome back,</h4>
                <h2>XriAura</h2>
            </div>
        </div>
    </div>

    <div class="balance-card">
        <h3>TOTAL BALANCE</h3>
        <div class="balance-amount">49</div>
    </div>

    <!-- Consistent Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="earn/index.html" class="nav-item">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="profile/index.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
