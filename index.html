<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XriAura - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mobile-container">
        <!-- Header -->
        <div class="header">
            <div class="user-profile">
                <div class="avatar-box">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar">
                </div>
                <div class="user-info">
                    <div style="font-size: 11px; color: #888;">Welcome back,</div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <h2 style="font-size: 16px; font-weight: 800;">XRI</h2>
                        <span class="badge">⚡️ Lv 1</span>
                    </div>
                    <span class="username">@xriyan_hub</span>
                </div>
            </div>
            <!-- Theme Toggle Icon -->
            <div style="background: rgba(255,183,3,0.15); border: 1px solid rgba(255,183,3,0.3); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffb703; box-shadow: 0 0 10px rgba(255,183,3,0.2);">
                🌙
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Balance & 3D Lightning Card -->
            <div class="main-card" style="padding: 22px;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <div style="font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 700;">TOTAL BALANCE</div>
                        <div style="font-size: 42px; font-weight: 900; color: #ffb703; text-shadow: 0 0 25px rgba(255,183,3,0.4); line-height: 1;">49</div>
                        
                        <div style="display: inline-flex; align-items: center; gap: 6px; background: rgba(46, 196, 182, 0.12); color: #2ec4b6; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; border: 1px solid rgba(46, 196, 182, 0.25); margin-top: 12px;">
                            <span>⚡️ WAVES · 🟢 $0.00049</span>
                        </div>
                        <div style="font-size: 10px; color: #666; margin-top: 6px;">1 WAVE = 0.00001 USDT</div>
                    </div>

                    <!-- 3D Floating Lightning Icon -->
                    <div class="floating-3d" style="font-size: 52px; filter: drop-shadow(0 0 20px #ffb703); margin-top: 5px;">
                        ⚡️
                    </div>
                </div>

                <!-- 3D Action Buttons -->
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 24px;">
                    <a href="earn.html" class="btn-gold" style="padding: 12px 0; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                        <span style="font-size: 16px;">⚡️</span>
                        <span>Earn</span>
                    </a>
                    <a href="profile.html" style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px 0; text-align: center; text-decoration: none; color: #fff; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                        <span style="font-size: 16px;">🔄</span>
                        <span>Convert</span>
                    </a>
                    <a href="profile.html" style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px 0; text-align: center; text-decoration: none; color: #fff; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                        <span style="font-size: 16px;">📥</span>
                        <span>Withdraw</span>
                    </a>
                </div>
            </div>

            <!-- Redeem Code Section -->
            <div class="main-card" style="display: flex; align-items: center; gap: 12px; padding: 16px;">
                <div style="background: linear-gradient(135deg, #a855f7, #7e22ce); width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3); flex-shrink: 0;">
                    🎟️
                </div>
                <div style="flex: 1;">
                    <div style="font-size: 12px; font-weight: 700; color: #fff;">Have a code? <span style="color: #888; font-weight: normal;">Redeem it for free WAVES</span></div>
                    <div style="display: flex; gap: 8px; margin-top: 8px;">
                        <input type="text" placeholder="Enter code" style="flex: 1; background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); padding: 9px 12px; border-radius: 10px; color: #fff; font-size: 12px; outline: none;">
                        <button class="btn-gold" style="padding: 0 16px; border-radius: 10px; font-size: 12px;">Redeem</button>
                    </div>
                </div>
            </div>

            <!-- Daily Bonus Section -->
            <div class="main-card" style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;">
                <div style="display: flex; align-items: center; gap: 14px;">
                    <div style="background: rgba(255,183,3,0.1); border: 1px solid var(--border-color); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px;">
                        🎡
                    </div>
                    <div>
                        <div style="font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;">DAILY BONUS</div>
                        <div style="font-size: 15px; font-weight: 800; color: #fff; margin-top: 2px;">Lucky Spin</div>
                        <div style="font-size: 11px; color: #888; margin-top: 2px;">Come back tomorrow</div>
                    </div>
                </div>
                <div style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #888; font-size: 14px;">
                    🔒
                </div>
            </div>
        </div>

        <!-- Center Glowing Mining Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </a>
            <a href="tasks.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                <span>Tasks</span>
            </a>
            
            <!-- Big Glowing Center Button for Earn -->
            <a href="earn.html" class="nav-item" style="margin-top: -20px;">
                <div style="width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg, #ffb703, #fb8500); display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 0 20px rgba(255,183,3,0.6), inset 0 2px 4px rgba(255,255,255,0.5); border: 2px solid #000;">
                    ⚡️
                </div>
                <span style="font-weight: 700; color: #ffb703; margin-top: 2px;">Earn</span>
            </a>

            <a href="refer.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                <span>Refer</span>
            </a>
            <a href="profile.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Profile</span>
            </a>
        </div>
    </div>

</body>
</html>
