<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XriAura - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mobile-container">
        <!-- Header -->
        <div class="header">
            <div class="user-profile">
                <div class="avatar-box">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar">
                </div>
                <div class="user-info">
                    <h2>Xriyan</h2>
                    <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px;">
                        <span class="badge">⚡️ Lv 1</span>
                        <span class="username">@xriyan_hub</span>
                    </div>
                </div>
            </div>
            <!-- Dark Mode Toggle Switch simulation -->
            <div style="background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); width: 44px; height: 24px; border-radius: 12px; display: flex; align-items: center; padding: 2px; cursor: pointer;">
                <div style="width: 20px; height: 20px; background: #ffb703; border-radius: 50%; box-shadow: 0 0 8px #ffb703; transform: translateX(20px);"></div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Balance & 3D Lightning Card -->
            <div class="main-card">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <div style="font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;">Total Balance</div>
                        <div style="font-size: 38px; font-weight: 900; color: #ffb703; text-shadow: 0 0 20px rgba(255,183,3,0.4);">49</div>
                        
                        <div style="display: inline-flex; align-items: center; gap: 6px; background: rgba(46, 196, 182, 0.12); color: #2ec4b6; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(46, 196, 182, 0.25); margin-top: 8px;">
                            <span>🟢 $0.00049 USDT</span>
                        </div>
                        <div style="font-size: 10px; color: #777; margin-top: 4px;">1 XAURA = 0.00001 USDT</div>
                    </div>

                    <!-- 3D Floating Lightning Graphic -->
                    <div class="floating-3d" style="font-size: 42px; text-shadow: 0 0 25px #ffb703; margin-top: 5px;">
                        ⚡️
                    </div>
                </div>

                <!-- Action Buttons Inside Card -->
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 22px;">
                    <a href="earn.html" class="btn-gold" style="padding: 10px 0; font-size: 12px;">⚡️ Earn</a>
                    <a href="profile.html" style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); border-radius: 14px; padding: 10px 0; text-align: center; text-decoration: none; color: #fff; font-size: 12px; font-weight: 600;">🔄 Convert</a>
                    <a href="profile.html" style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); border-radius: 14px; padding: 10px 0; text-align: center; text-decoration: none; color: #fff; font-size: 12px; font-weight: 600;">📥 Withdraw</a>
                </div>
            </div>

            <!-- Redeem Code Card -->
            <div class="main-card">
                <div style="font-size: 12px; font-weight: 600; margin-bottom: 8px;">Have a code? <span style="color: #888; font-weight: normal;">Redeem it for free XAURA</span></div>
                <div style="display: flex; gap: 8px;">
                    <input type="text" placeholder="Enter code" style="flex: 1; background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); padding: 11px 14px; border-radius: 12px; color: #fff; font-size: 13px; outline: none;">
                    <button class="btn-gold" style="padding: 0 18px; border-radius: 12px;">Redeem</button>
                </div>
            </div>

            <!-- Daily Bonus Card -->
            <div class="main-card" style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;">
                <div>
                    <div style="font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px;">Daily Bonus</div>
                    <div style="font-size: 15px; font-weight: 700; color: #fff; margin-top: 2px;">Lucky Spin</div>
                    <div style="font-size: 11px; color: #ffb703; margin-top: 2px;">Come back tomorrow</div>
                </div>
                <div style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #888;">
                    🔒
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </a>
            <a href="tasks.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                Tasks
            </a>
            <a href="earn.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                Earn
            </a>
            <a href="refer.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                Refer
            </a>
            <a href="profile.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Profile
            </a>
        </div>
    </div>

</body>
</html>
