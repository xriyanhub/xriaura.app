<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Convert Waves to USDT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            padding: 16px;
            padding-bottom: 90px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
        }

        .main-title {
            font-size: 20px;
            font-weight: 900;
        }

        .convert-card {
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .input-label {
            font-size: 11px;
            margin-bottom: 6px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }

        .input-field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-value {
            font-size: 20px;
            font-weight: 900;
            background: transparent;
            border: none;
            outline: none;
            width: 70%;
        }

        .currency-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
        }

        .swap-icon-container {
            text-align: center;
            margin: -6px 0;
            position: relative;
            z-index: 10;
        }

        .swap-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .convert-btn {
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
        }

        .info-note {
            font-size: 11px;
            text-align: center;
            margin-top: 12px;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="main-title">Convert WAVES</div>
    </div>

    <div class="convert-card">
        <div class="input-group">
            <div class="input-label">
                <span>YOU PAY</span>
                <span>Balance: 49 WAVES</span>
            </div>
            <div class="input-field-row">
                <input type="number" class="input-value" value="49">
                <div class="currency-badge"><i class="fa-solid fa-bolt"></i> WAVES</div>
            </div>
        </div>

        <div class="swap-icon-container">
            <div class="swap-circle"><i class="fa-solid fa-arrow-right-arrow-left"></i></div>
        </div>

        <div class="input-group">
            <div class="input-label">
                <span>YOU GET (ESTIMATED)</span>
            </div>
            <div class="input-field-row">
                <input type="text" class="input-value" value="0.00" readonly>
                <div class="currency-badge"><i class="fa-solid fa-dollar-sign"></i> USDT</div>
            </div>
        </div>

        <button class="convert-btn" onclick="alert('Conversion feature coming soon!')">CONVERT NOW</button>
        <div class="info-note">Instant swap with zero transaction fees.</div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="../../tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="../../earn/arcade.html" class="nav-item">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../index.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <!-- Linked to Profile Folder's Centralized Aura JS -->
    <script src="../aura.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
