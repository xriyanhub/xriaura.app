<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Wallet & Withdrawal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #12100e;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn {
            color: #ffb703;
            font-size: 18px;
            text-decoration: none;
        }

        .main-title {
            font-size: 18px;
            font-weight: 900;
            color: #ffb703;
        }

        .card {
            background: #191612;
            border: 1px solid #26221c;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card h3 {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffb703;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 10px;
            color: #aaa;
        }

        .info-row span {
            color: #fff;
            font-weight: 700;
        }

        .input-field {
            width: 100%;
            background: #12100e;
            border: 1px solid #26221c;
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            margin-bottom: 12px;
        }

        .action-btn {
            background: #ffb703;
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #14110d;
            border-top: 1px solid #26221c;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #777;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }

        .nav-item.active {
            color: #ffb703;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="main-title"><i class="fa-solid fa-wallet"></i> Wallet Hub</div>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-circle-info"></i> Withdrawal System Info</h3>
        <div class="info-row">
            Minimum Withdrawal: <span id="withdrawMinDisplay">Loading...</span>
        </div>
        <div class="info-row">
            Withdrawal Status: <span id="withdrawStatusDisplay">Loading...</span>
        </div>
        <div class="info-row">
            Supported Network: <span id="withdrawNetworkDisplay">Loading...</span>
        </div>
    </div>

    <div class="card">
        <h3>Request Withdrawal</h3>
        <input type="number" class="input-field" placeholder="Enter amount to withdraw">
        <input type="text" class="input-field" placeholder="Enter your TON Wallet Address">
        <button class="action-btn" onclick="requestWithdraw()">Submit Withdrawal</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="../../tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="../../earn/index.html" class="nav-item">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../index.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <!-- Firebase Realtime Database Integration -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBy2MFbE-B3VcD1GjbdRUds_IH_DcQKczo",
            authDomain: "xriaura.firebaseapp.com",
            databaseURL: "https://xriaura-default-rtdb.firebaseio.com",
            projectId: "xriaura",
            storageBucket: "xriaura.firebasestorage.app",
            messagingSenderId: "937962536194",
            appId: "1:937962536194:web:a5b024c230d50a7b58d61b",
            measurementId: "G-F2W224J9CY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Listen for Realtime Admin Settings Updates for Wallet
        db.ref("admin/homeSettings").on("value", (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                const minDisplay = document.getElementById('withdrawMinDisplay');
                const statusDisplay = document.getElementById('withdrawStatusDisplay');
                const networkDisplay = document.getElementById('withdrawNetworkDisplay');

                if (data.withdrawMin && minDisplay) minDisplay.innerText = `${data.withdrawMin} WAVES`;
                if (data.withdrawStatus && statusDisplay) statusDisplay.innerText = data.withdrawStatus;
                if (data.withdrawNetwork && networkDisplay) networkDisplay.innerText = data.withdrawNetwork;
            }
        });

        function requestWithdraw() {
            alert("Withdrawal request submitted successfully!");
        }
    </script>
</body>
</html>
