<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Withdraw USDT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #141414;
            border: 1px solid #222;
            color: #ffb703;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
        }

        .main-title {
            font-size: 20px;
            font-weight: 900;
        }

        .withdraw-card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .input-label {
            font-size: 11px;
            color: #777;
            margin-bottom: 6px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }

        .input-field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-value {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
        }

        .withdraw-btn {
            background: #22c55e;
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
            margin-top: 6px;
        }

        .info-note {
            font-size: 11px;
            color: #777;
            text-align: center;
            margin-top: 12px;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }

        .nav-item.active {
            color: #ffb703;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="main-title">Withdraw USDT</div>
    </div>

    <div class="withdraw-card">
        <div class="input-group">
            <div class="input-label">
                <span>WALLET ADDRESS (TON / TRC20)</span>
            </div>
            <div class="input-field-row">
                <input type="text" class="input-value" placeholder="Enter your wallet address" style="font-size: 13px;">
            </div>
        </div>

        <div class="input-group">
            <div class="input-label">
                <span>AMOUNT TO WITHDRAW</span>
                <span>Available: 0.00 USDT</span>
            </div>
            <div class="input-field-row">
                <input type="number" class="input-value" value="0.00">
            </div>
        </div>

        <button class="withdraw-btn" onclick="alert('Withdrawal request submitted!')">WITHDRAW NOW</button>
        <div class="info-note">Withdrawals are processed within 24 hours.</div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="../../tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="../../earn/arcade.html" class="nav-item">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../index.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
