<!DOCTYPE html>
<html lang="en" style="background-color: #12100e;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Owner Socials & Channels</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        html, body {
            background-color: #12100e !important;
            color: #ffffff;
        }

        body {
            padding: 16px;
            padding-bottom: 90px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
        }

        .main-title {
            font-size: 18px;
            font-weight: 900;
        }

        /* Admin/Owner Profile Card */
        .admin-card {
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }

        .admin-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px auto;
        }

        .admin-card h3 {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .admin-card p {
            font-size: 12px;
            font-weight: 700;
        }

        /* Section Group */
        .section-group {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .menu-list {
            border-radius: 16px;
            overflow: hidden;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .menu-info h5 {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .menu-info p {
            font-size: 11px;
        }

        .menu-right {
            font-size: 11px;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <a href="admin.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="main-title">Owner Socials & Channels</div>
    </div>

    <div class="admin-card">
        <div class="admin-avatar"><i class="fa-solid fa-user-shield"></i></div>
        <h3>Xri YΛη</h3>
        <p>Founder & Creator</p>
    </div>

    <div class="section-group">
        <div class="section-title">Official Channels</div>
        <div class="menu-list">
            <a href="https://youtube.com/@Xriyan_hub" target="_blank" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon icon-red"><i class="fa-brands fa-youtube"></i></div>
                    <div class="menu-info">
                        <h5>YouTube Channel</h5>
                        <p>Watch video tutorials & guides</p>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square menu-right"></i>
            </a>
            <a href="https://t.me/Xriyan_hub" target="_blank" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon icon-blue"><i class="fa-brands fa-telegram"></i></div>
                    <div class="menu-info">
                        <h5>Telegram Hub</h5>
                        <p>Official community channel</p>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square menu-right"></i>
            </a>
        </div>
    </div>

    <!-- Bottom Navigation Bar (Path adjusted for profile/admin/ directory) -->
    <div class="nav-bar">
        <a href="../../../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="../../../tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="../../../earn/arcade.html" class="nav-item">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../../../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../index.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <!-- Linked to Profile Folder's Aura JS -->
    <script src="../aura.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.body.style.opacity = "1";
        });

        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
