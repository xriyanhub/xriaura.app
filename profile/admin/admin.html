<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Secure Control Center</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #12100e;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .back-btn {
            background: #191612;
            border: 1px solid #26221c;
            color: #ffb703;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
        }

        .main-title {
            font-size: 18px;
            font-weight: 900;
        }

        /* Lockscreen PIN Box */
        #lockScreen {
            background: #191612;
            border: 1px solid #26221c;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            margin-top: 40px;
        }

        .lock-icon {
            width: 70px;
            height: 70px;
            background: rgba(255, 183, 3, 0.15);
            color: #ffb703;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px auto;
            border: 2px solid #ffb703;
        }

        #lockScreen h3 {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        #lockScreen p {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        /* Admin Dashboard (Hidden initially) */
        #adminDashboard {
            display: none;
        }

        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: #191612;
            border: 1px solid #26221c;
            color: #888;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .tab-btn.active {
            background: #ffb703;
            color: #000000;
            border-color: #ffb703;
        }

        .admin-card {
            background: #191612;
            border: 1px solid #26221c;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            font-size: 15px;
            font-weight: 800;
            color: #ffb703;
            border-bottom: 1px dashed #26221c;
            padding-bottom: 12px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 12px;
            font-weight: 700;
            color: #bbb;
            margin-bottom: 6px;
            display: block;
        }

        .input-field {
            width: 100%;
            background: #1f1b15;
            border: 1px solid #2a241c;
            border-radius: 12px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .input-field:focus {
            border-color: #ffb703;
        }

        .save-btn {
            background: #ffb703;
            color: #000000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.3);
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #14110d;
            border-top: 1px solid #26221c;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #777;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }

        .nav-item.active {
            color: #ffb703;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="main-title">Full App Control Center</div>
    </div>

    <!-- Security Lock Screen -->
    <div id="lockScreen">
        <div class="lock-icon"><i class="fa-solid fa-lock"></i></div>
        <h3>Restricted Access</h3>
        <p>Enter Master Security Key to unlock</p>
        <div class="input-group">
            <input type="password" id="pinInput" class="input-field" placeholder="Enter password..." style="text-align: center;">
        </div>
        <button class="save-btn" onclick="verifyPin()">Unlock Panel</button>
    </div>

    <!-- Main Protected Dashboard -->
    <div id="adminDashboard">
        <div class="tabs-container">
            <button class="tab-btn active"><i class="fa-solid fa-gear"></i> General</button>
            <a href="apps.html" class="tab-btn"><i class="fa-solid fa-cube"></i> Apps Hub</a>
            <a href="owner_social.html" class="tab-btn"><i class="fa-solid fa-user-shield"></i> Owner Socials</a>
        </div>

        <div class="admin-card">
            <div class="card-header">
                <i class="fa-solid fa-robot"></i>
                <span>Master Bot & App Configuration</span>
            </div>
            <div class="input-group">
                <label class="input-label">Bot Username (Without @)</label>
                <input type="text" class="input-field" value="xriyan_bot">
            </div>
            <div class="input-group">
                <label class="input-label">Currency Symbol</label>
                <input type="text" class="input-field" value="WAVES">
            </div>
            <div class="input-group">
                <label class="input-label">System Maintenance Mode</label>
                <input type="text" class="input-field" value="Online (Active)">
            </div>
        </div>

        <div class="admin-card">
            <div class="card-header">
                <i class="fa-solid fa-gift"></i>
                <span>Earnings, Referral & Bonuses</span>
            </div>
            <div class="input-group">
                <label class="input-label">Daily Login Bonus (Amount)</label>
                <input type="number" class="input-field" value="20">
            </div>
            <div class="input-group">
                <label class="input-label">Bonus Per Referral</label>
                <input type="number" class="input-field" value="5">
            </div>
            <div class="input-group">
                <label class="input-label">Tutorial Video Link (YouTube)</label>
                <input type="text" class="input-field" value="https://youtube.com/@Xriyan_hub">
            </div>
            <div class="input-group">
                <label class="input-label">Support Group/Channel Link</label>
                <input type="text" class="input-field" value="https://t.me/Xriyan_hub">
            </div>

            <button class="save-btn" onclick="alert('All system changes saved successfully!')">Save All Changes</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="../../tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="../../earn/arcade.html" class="nav-item">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../index.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Secure password set to "xriyanaura"
        const ADMIN_PASSWORD = "xriyanaura";

        function verifyPin() {
            const enteredValue = document.getElementById('pinInput').value;
            if (enteredValue === ADMIN_PASSWORD) {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
            } else {
                alert('Incorrect Security Password! Access Denied.');
                document.getElementById('pinInput').value = '';
            }
        }
    </script>
</body>
</html>
