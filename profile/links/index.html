<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Bio Links Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #12100e;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn {
            color: #ffb703;
            font-size: 18px;
            text-decoration: none;
        }

        .main-title {
            font-size: 18px;
            font-weight: 900;
            color: #ffb703;
        }

        .card {
            background: #191612;
            border: 1px solid #26221c;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card h3 {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ffb703;
        }

        .card p {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .input-field {
            width: 100%;
            background: #12100e;
            border: 1px solid #26221c;
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            margin-bottom: 12px;
        }

        .action-btn {
            background: #ffb703;
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #14110d;
            border-top: 1px solid #26221c;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #777;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }

        .nav-item.active {
            color: #ffb703;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="main-title"><i class="fa-solid fa-id-badge"></i> Bio Link Task</div>
    </div>

    <div class="card">
        <h3>Add Keyword to Telegram Bio</h3>
        <p id="bioDescText">Add the target keyword to your Telegram profile bio and claim your reward bonus.</p>
        
        <div style="font-size: 12px; color: #ffb703; font-weight: 700; margin-bottom: 6px;">Target Keyword:</div>
        <input type="text" id="targetKeyword" class="input-field" value="@ThunderWaves" readonly>
        
        <div style="font-size: 12px; color: #22c55e; font-weight: 700; margin-bottom: 12px;" id="bioRewardDisplay">Reward Bonus: Loading...</div>
        
        <button class="action-btn" onclick="verifyBio()">Verify Bio Link</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="../../tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="../../earn/index.html" class="nav-item">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../index.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <!-- Firebase Realtime Database Integration -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBy2MFbE-B3VcD1GjbdRUds_IH_DcQKczo",
            authDomain: "xriaura.firebaseapp.com",
            databaseURL: "https://xriaura-default-rtdb.firebaseio.com",
            projectId: "xriaura",
            storageBucket: "xriaura.firebasestorage.app",
            messagingSenderId: "937962536194",
            appId: "1:937962536194:web:a5b024c230d50a7b58d61b",
            measurementId: "G-F2W224J9CY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Listen for Realtime Admin Settings Updates for Bio Task
        db.ref("admin/homeSettings").on("value", (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                const keywordInput = document.getElementById('targetKeyword');
                const rewardDisplay = document.getElementById('bioRewardDisplay');

                if (data.bioKeyword && keywordInput) {
                    keywordInput.value = data.bioKeyword;
                }
                if (data.bioBonus && rewardDisplay) {
                    rewardDisplay.innerText = `Reward Bonus: +${data.bioBonus} WAVES`;
                }
            }
        });

        function verifyBio() {
            alert("Checking Telegram bio status...");
        }
    </script>
</body>
</html>
