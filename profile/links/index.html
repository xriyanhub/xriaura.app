            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

        html, body {

        body {

        }

        .header-top {

            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn {

            text-decoration: none;
        }

        .main-title {

            font-weight: 900;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-item {
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: 0.2s;
        }

        .menu-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .menu-info h3 {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .menu-info p {
            font-size: 11px;
        }

        .menu-arrow {
            font-size: 14px;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
