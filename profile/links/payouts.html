<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Payout Proofs</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            padding: 16px;
            padding-bottom: 90px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
        }

        .main-title {
            font-size: 20px;
            font-weight: 900;
        }

        .payout-card {
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
        }

        .payout-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 16px auto;
        }

        .payout-card h3 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .payout-card p {
            font-size: 12px;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="main-title">Payout Proofs</div>
    </div>

    <div class="payout-card">
        <div class="payout-icon"><i class="fa-solid fa-file-invoice-dollar"></i></div>
        <h3>No Payouts Yet</h3>
        <p>Verified blockchain transaction receipts and payout proofs will appear here.</p>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="../../tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="../../earn/arcade.html" class="nav-item">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../index.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <!-- Linked to Profile Folder's Centralized Aura JS -->
    <script src="../aura.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
