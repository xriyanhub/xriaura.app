<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Admin Control Center</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App & Realtime Database SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #12100e;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* 3D Live Dynamic Glowing Cards */
        @keyframes liveGlow3D {
            0% {
                border-color: #ffb703;
                box-shadow: 0 10px 30px rgba(255, 183, 3, 0.15), inset 0 0 12px rgba(255, 183, 3, 0.08);
            }
            50% {
                border-color: #fb8500;
                box-shadow: 0 15px 35px rgba(251, 133, 0, 0.35), inset 0 0 20px rgba(251, 133, 0, 0.2);
            }
            100% {
                border-color: #ffb703;
                box-shadow: 0 10px 30px rgba(255, 183, 3, 0.15), inset 0 0 12px rgba(255, 183, 3, 0.08);
            }
        }

        .admin-card {
            background: linear-gradient(135deg, #2a220c, #141414);
            border: 1px solid #ffb703;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            position: relative;
            animation: liveGlow3D 3.5s infinite ease-in-out;
        }

        .card-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            border-bottom: 1px dashed rgba(255, 183, 3, 0.3);
            padding-bottom: 10px;
        }

        .card-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-thumb {
            width: 42px;
            height: 42px;
            background: #1c1c1c;
            border: 2px solid #ffb703;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffb703;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.3);
        }

        .card-title-box h3 {
            font-size: 14px;
            font-weight: 800;
            color: #ffb703;
        }

        .slot-badge {
            background: #1c1c1c;
            color: #ffb703;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid #ffb703;
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.3);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-label {
            font-size: 10px;
            font-weight: 700;
            color: #aaa;
            margin-bottom: 4px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field {
            width: 100%;
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: #ffb703;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.4);
        }

        /* Theme Gold 3D Gradient Button */
        .save-btn {
            background: #ffb703;
            color: #000000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.3);
            transition: 0.2s;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }

        .nav-item.active {
            color: #ffb703;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="main-title">Home Features Control Center</div>
    </div>

    <!-- Main Control Dashboard -->
    <div id="adminDashboard">

        <!-- Slot 1: Bio Control (bio.html) -->
        <div class="admin-card">
            <div class="card-top-row">
                <div class="card-title-box">
                    <div class="card-thumb"><i class="fa-solid fa-id-badge"></i></div>
                    <h3>Bio Settings Control</h3>
                </div>
                <span class="slot-badge">Bio Hub</span>
            </div>
            <div class="input-group">
                <label class="input-label">Bio Link Requirement Status</label>
                <input type="text" id="bioStatus" class="input-field" value="Active / Required">
            </div>
            <div class="input-group">
                <label class="input-label">Bio Reward Bonus (WAVES)</label>
                <input type="number" id="bioBonus" class="input-field" value="100">
            </div>
            <div class="input-group">
                <label class="input-label">Target Bio Keyword</label>
                <input type="text" id="bioKeyword" class="input-field" value="@ThunderWaves">
            </div>
        </div>

        <!-- Slot 2: Currency Convert Control (convert.html) -->
        <div class="admin-card">
            <div class="card-top-row">
                <div class="card-title-box">
                    <div class="card-thumb"><i class="fa-solid fa-rotate"></i></div>
                    <h3>Convert Settings Control</h3>
                </div>
                <span class="slot-badge">Convert</span>
            </div>
            <div class="input-group">
                <label class="input-label">Conversion Rate (Points to Token)</label>
                <input type="text" id="convertRate" class="input-field" value="1000 WAVES = 1 TON">
            </div>
            <div class="input-group">
                <label class="input-label">Minimum Convert Limit</label>
                <input type="number" id="convertLimit" class="input-field" value="5000">
            </div>
            <div class="input-group">
                <label class="input-label">Convert Fee (%)</label>
                <input type="text" id="convertFee" class="input-field" value="1%">
            </div>
        </div>

        <!-- Slot 3: Withdraw Control (withdraw.html) -->
        <div class="admin-card">
            <div class="card-top-row">
                <div class="card-title-box">
                    <div class="card-thumb"><i class="fa-solid fa-wallet"></i></div>
                    <h3>Withdrawal Settings Control</h3>
                </div>
                <span class="slot-badge">Withdraw</span>
            </div>
            <div class="input-group">
                <label class="input-label">Minimum Withdrawal Amount</label>
                <input type="number" id="withdrawMin" class="input-field" value="10000">
            </div>
            <div class="input-group">
                <label class="input-label">Withdrawal Status</label>
                <input type="text" id="withdrawStatus" class="input-field" value="Open / Active">
            </div>
            <div class="input-group">
                <label class="input-label">Supported Network</label>
                <input type="text" id="withdrawNetwork" class="input-field" value="TON Network">
            </div>
        </div>

        <!-- Slot 4: Spin Wheel Control (spin.html) -->
        <div class="admin-card">
            <div class="card-top-row">
                <div class="card-title-box">
                    <div class="card-thumb"><i class="fa-solid fa-circle-notch"></i></div>
                    <h3>Spin Wheel Control</h3>
                </div>
                <span class="slot-badge">Spin</span>
            </div>
            <div class="input-group">
                <label class="input-label">Daily Free Spins Limit</label>
                <input type="number" id="spinLimit" class="input-field" value="3">
            </div>
            <div class="input-group">
                <label class="input-label">Spin Cost (If any)</label>
                <input type="number" id="spinCost" class="input-field" value="50">
            </div>
            <div class="input-group">
                <label class="input-label">Max Reward per Spin</label>
                <input type="number" id="spinMaxReward" class="input-field" value="500">
            </div>
        </div>

        <!-- Slot 5: Master Save Action Slot -->
        <div class="admin-card">
            <div class="card-top-row">
                <div class="card-title-box">
                    <div class="card-thumb"><i class="fa-solid fa-sliders"></i></div>
                    <h3>General Home Config</h3>
                </div>
                <span class="slot-badge">Config</span>
            </div>
            <div class="input-group">
                <label class="input-label">App Announcement Header</label>
                <input type="text" id="announcement" class="input-field" value="@ThunderWaves ⚡">
            </div>
            <div class="input-group">
                <label class="input-label">System Notice / Banner</label>
                <input type="text" id="systemNotice" class="input-field" value="Welcome to XriAura Web3 Platform">
            </div>

            <button class="save-btn" onclick="saveAllSettings()"><i class="fa-solid fa-floppy-disk"></i> Save All Home Settings</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="../../tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="../../earn/index.html" class="nav-item">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../index.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        // Telegram WebApp Initialization
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Firebase Initialization with your config
        const firebaseConfig = {
            apiKey: "AIzaSyBy2MFbE-B3VcD1GjbdRUds_IH_DcQKczo",
            authDomain: "xriaura.firebaseapp.com",
            databaseURL: "https://xriaura-default-rtdb.firebaseio.com",
            projectId: "xriaura",
            storageBucket: "xriaura.firebasestorage.app",
            messagingSenderId: "937962536194",
            appId: "1:937962536194:web:a5b024c230d50a7b58d61b",
            measurementId: "G-F2W224J9CY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Save Data to Firebase Realtime Database
        function saveAllSettings() {
            const settingsData = {
                bioStatus: document.getElementById('bioStatus').value,
                bioBonus: document.getElementById('bioBonus').value,
                bioKeyword: document.getElementById('bioKeyword').value,
                convertRate: document.getElementById('convertRate').value,
                convertLimit: document.getElementById('convertLimit').value,
                convertFee: document.getElementById('convertFee').value,
                withdrawMin: document.getElementById('withdrawMin').value,
                withdrawStatus: document.getElementById('withdrawStatus').value,
                withdrawNetwork: document.getElementById('withdrawNetwork').value,
                spinLimit: document.getElementById('spinLimit').value,
                spinCost: document.getElementById('spinCost').value,
                spinMaxReward: document.getElementById('spinMaxReward').value,
                announcement: document.getElementById('announcement').value,
                systemNotice: document.getElementById('systemNotice').value,
                updatedAt: new Date().toISOString()
            };

            db.ref("admin/homeSettings").set(settingsData)
            .then(() => {
                alert('All Home settings saved & synced to Realtime Database successfully!');
            })
            .catch((error) => {
                alert('Error saving data: ' + error.message);
            });
        }

        // Load existing settings from Firebase Realtime Database on page load
        window.addEventListener('DOMContentLoaded', () => {
            db.ref("admin/homeSettings").once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if(document.getElementById('bioStatus')) document.getElementById('bioStatus').value = data.bioStatus || '';
                    if(document.getElementById('bioBonus')) document.getElementById('bioBonus').value = data.bioBonus || '';
                    if(document.getElementById('bioKeyword')) document.getElementById('bioKeyword').value = data.bioKeyword || '';
                    if(document.getElementById('convertRate')) document.getElementById('convertRate').value = data.convertRate || '';
                    if(document.getElementById('convertLimit')) document.getElementById('convertLimit').value = data.convertLimit || '';
                    if(document.getElementById('convertFee')) document.getElementById('convertFee').value = data.convertFee || '';
                    if(document.getElementById('withdrawMin')) document.getElementById('withdrawMin').value = data.withdrawMin || '';
                    if(document.getElementById('withdrawStatus')) document.getElementById('withdrawStatus').value = data.withdrawStatus || '';
                    if(document.getElementById('withdrawNetwork')) document.getElementById('withdrawNetwork').value = data.withdrawNetwork || '';
                    if(document.getElementById('spinLimit')) document.getElementById('spinLimit').value = data.spinLimit || '';
                    if(document.getElementById('spinCost')) document.getElementById('spinCost').value = data.spinCost || '';
                    if(document.getElementById('spinMaxReward')) document.getElementById('spinMaxReward').value = data.spinMaxReward || '';
                    if(document.getElementById('announcement')) document.getElementById('announcement').value = data.announcement || '';
                    if(document.getElementById('systemNotice')) document.getElementById('systemNotice').value = data.systemNotice || '';
                }
            }).catch((error) => {
                console.log("Error loading settings: ", error);
            });
        });
    </script>
</body>
</html>
