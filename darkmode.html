<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Dark Mode Settings</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #12100e;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #191612;
            border: 1px solid #26221c;
            color: #ffb703;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
        }

        .main-title {
            font-size: 20px;
            font-weight: 900;
        }

        .settings-card {
            background: #191612;
            border: 1px solid #26221c;
            border-radius: 16px;
            padding: 18px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .settings-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .settings-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 183, 3, 0.15);
            color: #ffb703;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .settings-info h5 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .settings-info p {
            font-size: 11px;
            color: #888;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #26221c;
            transition: .3s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #ffb703;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #14110d;
            border-top: 1px solid #26221c;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #777;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }

        .nav-item.active {
            color: #ffb703;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="main-title">Theme Settings</div>
    </div>

    <div class="settings-card">
        <div class="settings-left">
            <div class="settings-icon"><i class="fa-solid fa-moon"></i></div>
            <div class="settings-info">
                <h5>Dark mode</h5>
                <p>Always use dark aesthetic</p>
            </div>
        </div>
        <label class="switch">
            <input type="checkbox" checked id="darkModeToggle" onchange="toggleTheme(this)">
            <span class="slider"></span>
        </label>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="../../tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="../../earn/arcade.html" class="nav-item">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../index.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function toggleTheme(checkbox) {
            if(checkbox.checked) {
                document.body.style.backgroundColor = "#12100e";
            } else {
                document.body.style.backgroundColor = "#1c1915";
            }
        }
    </script>
</body>
</html>
