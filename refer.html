<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XriAura - Refer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mobile-container">
        <!-- Header -->
        <div class="header">
            <div class="user-profile">
                <div class="user-info">
                    <h2 style="font-size: 20px;">Refer & Earn</h2>
                    <p style="font-size: 11px; color: #888;">Invite friends, collect XAURA</p>
                </div>
            </div>
            <div class="username">@xriyan_hub</div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Referral Stats Card -->
            <div class="main-card" style="text-align: center; padding: 20px;">
                <div style="font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px;">You earn per friend</div>
                <div style="font-size: 32px; font-weight: 800; color: #ffb703; margin: 8px 0;">+1,000</div>
                <div style="font-size: 12px; color: #888; margin-bottom: 15px;">XAURA ≈ $0.01</div>

                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                    <div>
                        <div style="font-size: 12px; font-weight: bold; color: #ffb703;">+500</div>
                        <div style="font-size: 10px; color: #888; margin-top: 2px;">Join bonus</div>
                    </div>
                    <div>
                        <div style="font-size: 12px; font-weight: bold; color: #ffb703;">+500</div>
                        <div style="font-size: 10px; color: #888; margin-top: 2px;">after 5 games</div>
                    </div>
                    <div style="background: rgba(255,183,3,0.1); border: 1px solid rgba(255,183,3,0.3); border-radius: 10px; padding: 4px;">
                        <div style="font-size: 12px; font-weight: bold; color: #ffb703;">5%</div>
                        <div style="font-size: 9px; color: #888;">Lifetime share</div>
                    </div>
                </div>
            </div>

            <!-- Stats Bar -->
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px;">
                <div class="main-card" style="text-align: center; padding: 12px; margin-bottom: 0;">
                    <div style="font-size: 14px; font-weight: bold;">0</div>
                    <div style="font-size: 10px; color: #888; margin-top: 2px;">FRIENDS</div>
                </div>
                <div class="main-card" style="text-align: center; padding: 12px; margin-bottom: 0;">
                    <div style="font-size: 14px; font-weight: bold; color: #2ec4b6;">0</div>
                    <div style="font-size: 10px; color: #888; margin-top: 2px;">ACTIVE</div>
                </div>
                <div class="main-card" style="text-align: center; padding: 12px; margin-bottom: 0;">
                    <div style="font-size: 14px; font-weight: bold; color: #ffb703;">0</div>
                    <div style="font-size: 10px; color: #888; margin-top: 2px;">TOTAL EARNED</div>
                </div>
            </div>

            <!-- Invite Link Box -->
            <div class="main-card" style="padding: 15px;">
                <div style="font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 4px;">Your Invite Link</div>
                <div style="font-size: 11px; color: #ffb703; word-break: break-all; margin-bottom: 12px;">t.me/XriAuraBot/App?startapp=ref_xriyan</div>
                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px;">
                    <button style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 12px; font-weight: 600; font-size: 12px; cursor: pointer;">Copy</button>
                    <button style="background: #ffb703; color: #000; border: none; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer;">Share</button>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#888"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </a>
            <a href="tasks.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#888"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                Tasks
            </a>
            <a href="earn.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#888"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                Earn
            </a>
            <a href="refer.html" class="nav-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#888"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                Refer
            </a>
            <a href="profile.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#888"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Profile
            </a>
        </div>
    </div>

</body>
</html>
