<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XriAura - Home Dashboard</title>
</head>
<body>
    <div class="home-container">
        <!-- Welcome Banner -->
        <div class="welcome-banner amber-glow-box">
            <h2>Welcome back, <span id="usernameDisplay" class="amber-text">Aura User</span>! ⚡</h2>
            <p>Your ThunderWaves earning ecosystem is active.</p>
        </div>

        <!-- Balance Card -->
        <div class="balance-card amber-glow-box">
            <h3>Total Balance</h3>
            <div class="balance-amount"><span id="userBalance" class="amber-text">0.00</span> XRI</div>
            <div class="balance-actions">
                <button id="claimBtn" class="amber-btn">Claim Yield</button>
            </div>
        </div>

        <!-- Quick Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card amber-glow-box">
                <h4>Active Staking</h4>
                <p id="activeStake">0.00 XRI</p>
            </div>
            <div class="stat-card amber-glow-box">
                <h4>Referral Earnings</h4>
                <p id="referralEarnings">0.00 XRI</p>
            </div>
        </div>
    </div>
</body>
</html>
