<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XriAura - Earn</title>
</head>
<body>
    <div class="earn-container">
        <div class="earn-header amber-glow-box">
            <h2>ThunderWaves <span class="amber-text">Earning Hub</span></h2>
            <p>Perform quick actions and earn XRI instantly.</p>
        </div>

        <!-- Earning Action Cards -->
        <div class="earn-grid">
            <div class="earn-card amber-glow-box">
                <h3>Daily Check-In</h3>
                <p>Claim your daily bonus reward.</p>
                <button id="claimDailyBtn" class="amber-btn">Claim 5.00 XRI</button>
            </div>
            <div class="earn-card amber-glow-box">
                <h3>Thunder Boost</h3>
                <p>Activate high-speed earning session.</p>
                <button id="boostBtn" class="amber-btn">Activate Boost</button>
            </div>
        </div>

        <div id="earnMessage" class="auth-message"></div>
    </div>
</body>
</html>
