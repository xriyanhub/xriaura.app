<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XriAura - Tasks</title>
</head>
<body>
    <div class="task-container">
        <div class="task-header amber-glow-box">
            <h2>ThunderWaves <span class="amber-text">Daily Tasks</span></h2>
            <p>Complete missions to boost your XRI earnings.</p>
        </div>

        <div class="task-list">
            <div class="task-item amber-glow-box">
                <div class="task-info">
                    <h4>Join Telegram Channel</h4>
                    <p>Earn +10.00 XRI</p>
                </div>
                <button class="amber-btn task-btn" data-reward="10">Complete</button>
            </div>
            <div class="task-item amber-glow-box">
                <div class="task-info">
                    <h4>Follow on Twitter / X</h4>
                    <p>Earn +15.00 XRI</p>
                </div>
                <button class="amber-btn task-btn" data-reward="15">Complete</button>
            </div>
        </div>

        <div id="taskMessage" class="auth-message"></div>
    </div>
</body>
</html>
