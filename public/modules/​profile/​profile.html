<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XriAura - Profile</title>
</head>
<body>
    <div class="profile-container">
        <div class="profile-header amber-glow-box">
            <h2>User <span class="amber-text">Profile</span></h2>
            <p>Manage your account settings and security.</p>
        </div>

        <div class="profile-card amber-glow-box">
            <div class="profile-info-group">
                <label>Username</label>
                <p id="profileUsername">Loading...</p>
            </div>
            <div class="profile-info-group">
                <label>Email Address</label>
                <p id="profileEmail">Loading...</p>
            </div>
            <div class="profile-info-group">
                <label>Account Status</label>
                <p id="profileStatus" class="amber-text">Active & Verified</p>
            </div>
            <button id="logoutBtn" class="amber-btn" style="background-color: #ef4444; margin-top: 20px;">Logout</button>
        </div>
    </div>
</body>
</html>
