<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Tasks Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            padding: 16px;
            padding-bottom: 90px;
        }

        .header-top {
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .main-title {
            font-size: 22px;
            font-weight: 900;
        }

        .desc {
            font-size: 12px;
            margin-bottom: 20px;
        }

        /* Category Tabs */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-card {
            border-radius: 16px;
            padding: 14px 12px;
            min-width: 80px;
            text-align: center;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .cat-icon {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .cat-name {
            font-size: 11px;
            font-weight: 700;
        }

        .badge {
            position: absolute;
            top: 6px;
            right: 6px;
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 10px;
        }

        /* Sub Nav Bar */
        .sub-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .sub-btn {
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
            text-decoration: none;
        }

        /* Iframe Container for Modular Tasks */
        .content-frame {
            width: 100%;
            height: 450px;
            border: none;
            background: transparent;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="subtitle"><i class="fa-solid fa-bolt"></i> Complete & Collect</div>
        <div class="main-title">Tasks Hub</div>
    </div>
    <div class="desc" id="taskHeaderDesc">Complete tasks, collect WAVES</div>

    <!-- Category Tabs linking the 4 Modular Files -->
    <div class="categories">
        <div class="cat-card active" onclick="loadTab('social.html', this)">
            <div class="badge" id="socialBadge">4</div>
            <div class="cat-icon"><i class="fa-solid fa-bullhorn"></i></div>
            <div class="cat-name">Social</div>
        </div>
        <div class="cat-card" onclick="loadTab('daily.html', this)">
            <div class="badge" id="dailyBadge">7</div>
            <div class="cat-icon"><i class="fa-solid fa-calendar-days"></i></div>
            <div class="cat-name">Daily</div>
        </div>
        <div class="cat-card" onclick="loadTab('exclusive.html', this)">
            <div class="badge" id="exclusiveBadge">2</div>
            <div class="cat-icon"><i class="fa-solid fa-gem"></i></div>
            <div class="cat-name">Exclusive</div>
        </div>
        <div class="cat-card" onclick="loadTab('partner.html', this)">
            <div class="badge" id="partnerBadge">22</div>
            <div class="cat-icon"><i class="fa-solid fa-handshake"></i></div>
            <div class="cat-name">Partner</div>
        </div>
    </div>

    <!-- Sub Nav -->
    <div class="sub-nav">
        <div class="sub-btn active">Tasks</div>
        <div class="sub-btn">My tasks</div>
        <div class="sub-btn" id="addTaskBtn">+ Add task</div>
    </div>

    <!-- Dynamic Modular Content Loader for files: social.html, daily.html, exclusive.html, partner.html -->
    <iframe id="taskFrame" src="social.html" class="content-frame"></iframe>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="../earn/index.html" class="nav-item">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../profile/index.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <!-- Tasks Aura JS Controller -->
    <script src="aura.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBy2MFbE-B3VcD1GjbdRUds_IH_DcQKczo",
            authDomain: "xriaura.firebaseapp.com",
            databaseURL: "https://xriaura-default-rtdb.firebaseio.com",
            projectId: "xriaura",
            storageBucket: "xriaura.firebasestorage.app",
            messagingSenderId: "937962536194",
            appId: "1:937962536194:web:a5b024c230d50a7b58d61b",
            measurementId: "G-F2W224J9CY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Listen for Realtime Admin Settings Updates for Tasks Badges & Counts
        db.ref("admin/homeSettings").on("value", (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                const socialB = document.getElementById('socialBadge');
                const dailyB = document.getElementById('dailyBadge');
                const exclusiveB = document.getElementById('exclusiveBadge');
                const partnerB = document.getElementById('partnerBadge');

                if (data.socialTaskCount && socialB) socialB.innerText = data.socialTaskCount;
                if (data.dailyTaskCount && dailyB) dailyB.innerText = data.dailyTaskCount;
                if (data.exclusiveTaskCount && exclusiveB) exclusiveB.innerText = data.exclusiveTaskCount;
                if (data.partnerTaskCount && partnerB) partnerB.innerText = data.partnerTaskCount;
            }
        });

        function loadTab(page, element) {
            document.querySelectorAll('.cat-card').forEach(c => {
                c.classList.remove('active');
                c.style.background = "#141414";
                c.style.borderColor = "#222";
            });
            element.classList.add('active');
            element.style.background = "linear-gradient(135deg, #2a220c, #141414)";
            element.style.borderColor = "#ffb703";
            document.getElementById('taskFrame').src = page;
        }
    </script>
</body>
</html>
