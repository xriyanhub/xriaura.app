<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Tasks Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
        }

        .header-top {
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 11px;
            color: #ffb703;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .main-title {
            font-size: 22px;
            font-weight: 900;
        }

        .desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        /* Category Tabs */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 14px 12px;
            min-width: 80px;
            text-align: center;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .cat-card.active {
            background: linear-gradient(135deg, #2a220c, #141414);
            border-color: #ffb703;
        }

        .cat-icon {
            font-size: 18px;
            color: #ffb703;
            margin-bottom: 8px;
        }

        .cat-name {
            font-size: 11px;
            font-weight: 700;
            color: #bbb;
        }

        .cat-card.active .cat-name {
            color: #fff;
        }

        .badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #ff4757;
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 10px;
        }

        /* Sub Nav Bar */
        .sub-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .sub-btn {
            background: #141414;
            border: 1px solid #222;
            color: #888;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .sub-btn.active {
            background: #ffb703;
            color: #000;
            border-color: #ffb703;
        }

        /* Iframe Container for Modular Tasks */
        .content-frame {
            width: 100%;
            height: 450px;
            border: none;
            background: transparent;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #14110d;
            border-top: 1px solid #26221c;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #777;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }

        .nav-item.active {
            color: #ffb703;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="subtitle"><i class="fa-solid fa-bolt"></i> Complete & Collect</div>
        <div class="main-title">Tasks</div>
    </div>
    <div class="desc">Complete tasks, collect WAVES</div>

    <!-- Category Tabs -->
    <div class="categories">
        <div class="cat-card active" onclick="loadTab('social.html', this)">
            <div class="badge">4</div>
            <div class="cat-icon"><i class="fa-solid fa-bullhorn"></i></div>
            <div class="cat-name">Social</div>
        </div>
        <div class="cat-card" onclick="loadTab('daily.html', this)">
            <div class="badge">7</div>
            <div class="cat-icon"><i class="fa-solid fa-calendar-days"></i></div>
            <div class="cat-name">Daily</div>
        </div>
        <div class="cat-card" onclick="loadTab('exclusive.html', this)">
            <div class="badge">2</div>
            <div class="cat-icon"><i class="fa-solid fa-gem"></i></div>
            <div class="cat-name">Exclusive</div>
        </div>
        <div class="cat-card" onclick="loadTab('partner.html', this)">
            <div class="badge">22</div>
            <div class="cat-icon"><i class="fa-solid fa-handshake"></i></div>
            <div class="cat-name">Partner</div>
        </div>
    </div>

    <!-- Sub Nav -->
    <div class="sub-nav">
        <div class="sub-btn active">Tasks</div>
        <div class="sub-btn">My tasks</div>
        <div class="sub-btn" style="color: #ffb703;">+ Add task</div>
    </div>

    <!-- Dynamic Modular Content Loader -->
    <iframe id="taskFrame" src="social.html" class="content-frame"></iframe>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="../earn/index.html" class="nav-item">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../profile/index.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function loadTab(page, element) {
            document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('taskFrame').src = page;
        }
    </script>
</body>
</html>
