<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XriAura - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mobile-container">
        <!-- Header -->
        <div class="header">
            <div class="user-profile">
                <div class="avatar-box">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar">
                </div>
                <div class="user-info">
                    <h2>Xriyan</h2>
                    <span class="badge">⚡️ Lv 1</span>
                </div>
            </div>
            <div class="username">@xriyan_hub</div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Progress Bar Card -->
            <div class="main-card">
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px;">
                    <span>Progress to level 2</span>
                    <span style="color: #ffb703; font-weight: bold;">49 / 10K</span>
                </div>
                <div style="width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; margin-bottom: 8px;">
                    <div style="width: 1%; height: 100%; background: #ffb703; border-radius: 3px;"></div>
                </div>
                <div style="font-size: 11px; color: #888;">9,951 XAURA more to reach level 2</div>
            </div>

            <!-- Stats Grid -->
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px;">
                <div class="main-card" style="text-align: center; padding: 12px; margin-bottom: 0;">
                    <div style="font-size: 10px; color: #888;">EARNED</div>
                    <div style="font-size: 15px; font-weight: bold; color: #ffb703; margin-top: 4px;">49</div>
                </div>
                <div class="main-card" style="text-align: center; padding: 12px; margin-bottom: 0;">
                    <div style="font-size: 10px; color: #888;">WITHDRAWN</div>
                    <div style="font-size: 15px; font-weight: bold; color: #2ec4b6; margin-top: 4px;">$0.00</div>
                </div>
                <div class="main-card" style="text-align: center; padding: 12px; margin-bottom: 0;">
                    <div style="font-size: 10px; color: #888;">FRIENDS</div>
                    <div style="font-size: 15px; font-weight: bold; color: #b5838d; margin-top: 4px;">0</div>
                </div>
            </div>

            <!-- Wallet Menu Options -->
            <div style="font-size: 11px; color: #ffb703; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold;">Wallet</div>
            
            <div class="main-card" style="padding: 0; overflow: hidden;">
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="background: rgba(255,183,3,0.15); padding: 8px; border-radius: 10px;">🔄</span>
                        <div>
                            <div style="font-size: 13px; font-weight: 600;">Convert</div>
                            <div style="font-size: 11px; color: #888;">Swap XAURA for USDT</div>
                        </div>
                    </div>
                    <span style="color: #888;">›</span>
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="background: rgba(46,196,182,0.15); padding: 8px; border-radius: 10px;">📥</span>
                        <div>
                            <div style="font-size: 13px; font-weight: 600;">Withdraw</div>
                            <div style="font-size: 11px; color: #888;">Send USDT to your wallet</div>
                        </div>
                    </div>
                    <span style="color: #888;">›</span>
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="background: rgba(255,255,255,0.05); padding: 8px; border-radius: 10px;">👛</span>
                        <div>
                            <div style="font-size: 13px; font-weight: 600;">Set wallet</div>
                            <div style="font-size: 11px; color: #888;">Not connected</div>
                        </div>
                    </div>
                    <span style="color: #888;">›</span>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#888"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </a>
            <a href="tasks.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#888"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                Tasks
            </a>
            <a href="earn.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#888"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                Earn
            </a>
            <a href="refer.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#888"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                Refer
            </a>
            <a href="profile.html" class="nav-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#888"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Profile
            </a>
        </div>
    </div>

</body>
</html>
