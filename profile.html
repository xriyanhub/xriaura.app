<body>

    <div class="mobile-container">
        <!-- Header -->
        <div class="header">
            <div class="user-profile">
                <div class="avatar-box">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar">
                </div>
                <div class="user-info">
                    <h2>Profile & Wallet</h2>
                    <span class="badge">⚡️ Level 1</span>
                </div>
            </div>
            <div class="username">@xriyan_hub</div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="balance-card" style="text-align: left; padding: 20px;">
                <h3 style="font-size: 15px; margin-bottom: 8px; color: #ffb703;">Account Details</h3>
                <p style="font-size: 12px; color: #888; margin-bottom: 15px;">Manage your connected wallet and account status.</p>
                
                <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,183,3,0.1); padding: 12px; border-radius: 14px; margin-bottom: 10px;">
                    <div style="font-size: 11px; color: #888;">Telegram ID</div>
                    <div style="font-size: 13px; font-weight: 600; color: #fff;">7849201948</div>
                </div>

                <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,183,3,0.1); padding: 12px; border-radius: 14px; margin-bottom: 15px;">
                    <div style="font-size: 11px; color: #888;">Wallet Status</div>
                    <div style="font-size: 13px; font-weight: 600; color: #2ec4b6;">Not Connected</div>
                </div>

                <button style="width: 100%; background: #ffb703; color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 0 15px rgba(255,183,3,0.2);">Connect Wallet</button>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item">
