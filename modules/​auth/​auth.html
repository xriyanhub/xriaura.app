<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XriAura - Auth</title>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card amber-glow-box">
            <div class="auth-header">
                <h2>Welcome to <span class="amber-text">XriAura</span></h2>
                <p>Enter the ThunderWaves Ecosystem</p>
            </div>

            <!-- Toggle Tabs -->
            <div class="auth-tabs">
                <button id="showLogin" class="tab-btn active">Login</button>
                <button id="showRegister" class="tab-btn">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="amber-btn">Login to XriAura</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" style="display: none;">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" required placeholder="Choose a username">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required placeholder="Create a password">
                </div>
                <div class="input-group">
                    <label>Referral Code (Optional)</label>
                    <input type="text" id="regReferral" placeholder="XRIXXXXXX">
                </div>
                <button type="submit" class="amber-btn">Create Account</button>
            </form>

            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>
</body>
                      </html>
