<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XriAura - Referrals</title>
</head>
<body>
    <div class="refer-container">
        <div class="refer-header amber-glow-box">
            <h2>Invite & <span class="amber-text">Earn XRI</span></h2>
            <p>Share your referral link and earn 10% of your friends' yields.</p>
        </div>

        <div class="refer-card amber-glow-box">
            <h3>Your Referral Link</h3>
            <div class="refer-input-group">
                <input type="text" id="referralLinkInput" readonly value="Loading link...">
                <button id="copyRefBtn" class="amber-btn">Copy</button>
            </div>
            <div id="referMessage" class="auth-message" style="margin-top: 10px;"></div>
        </div>
    </div>
</body>
</html>
