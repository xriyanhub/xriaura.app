<!DOCTYPE html>
<html lang="en" style="background-color: #12100e;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Arcade Games</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        html, body {
            background-color: #12100e !important;
            color: #ffffff;
        }

        body {
            padding: 16px;
            padding-bottom: 90px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .header-top {
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .main-title {
            font-size: 22px;
            font-weight: 900;
        }

        .desc {
            font-size: 12px;
            margin-bottom: 16px;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            border-radius: 16px;
            padding: 14px;
            flex: 1;
        }

        .stat-card .val {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .stat-card .lbl {
            font-size: 11px;
        }

        /* Contest Results Banner */
        .contest-banner {
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .contest-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contest-left i {
            font-size: 20px;
        }

        .contest-info h5 {
            font-size: 12px;
            font-weight: 700;
        }

        .contest-info p {
            font-size: 10px;
        }

        .view-btn {
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
        }

        /* Featured Game Card */
        .featured-game {
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .game-title {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .game-sub {
            font-size: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .play-btn {
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Daily Bonus Card */
        .bonus-card {
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            text-decoration: none;
            color: inherit;
        }

        .bonus-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bonus-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .bonus-info h4 {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .bonus-info p {
            font-size: 11px;
        }

        /* Categories Filter */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Game Grid */
        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .game-card-mini {
            border-radius: 16px;
            padding: 12px;
            text-align: left;
        }

        .mini-thumb {
            width: 100%;
            height: 80px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .game-card-mini h5 {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .game-card-mini p {
            font-size: 11px;
            font-weight: 600;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="subtitle"><i class="fa-solid fa-bolt"></i> Play & Earn</div>
        <div class="main-title">Arcade</div>
    </div>
    <div class="desc">Play mini-games, win WAVES</div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="val">+49</div>
            <div class="lbl">Earned today</div>
        </div>
        <div class="stat-card">
            <div class="val">36</div>
            <div class="lbl">Plays left</div>
        </div>
    </div>

    <div class="contest-banner">
        <div class="contest-left">
            <i class="fa-solid fa-trophy"></i>
            <div class="contest-info">
                <h5>Snake &bull; 107K</h5>
                <p>Rewards sent</p>
            </div>
        </div>
        <button class="view-btn">View</button>
    </div>

    <div class="featured-game">
        <div class="game-title">Space Shooter</div>
        <div class="game-sub"><i class="fa-solid fa-bolt" style="color:#ffb703;"></i> Up to 330 &nbsp;&bull;&nbsp; 4/4 plays</div>
        <button class="play-btn" onclick="alert('Launching Space Shooter!')"><i class="fa-solid fa-play"></i> Play</button>
    </div>

    <a href="spin.html" class="bonus-card">
        <div class="bonus-left">
            <div class="bonus-icon"><i class="fa-solid fa-rotate"></i></div>
            <div class="bonus-info">
                <h4>Lucky Spin</h4>
                <p>Back in 08:08:45</p>
            </div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color: #666; font-size: 12px;"></i>
    </a>

    <div class="categories">
        <div class="cat-chip active">All</div>
        <div class="cat-chip">Arcade</div>
        <div class="cat-chip">Sports</div>
        <div class="cat-chip">Puzzle</div>
        <div class="cat-chip">Brain</div>
    </div>

    <div class="games-grid">
        <div class="game-card-mini">
            <div class="mini-thumb"><i class="fa-solid fa-car"></i></div>
            <h5>Lane Racer</h5>
            <p><i class="fa-solid fa-bolt"></i> +450</p>
        </div>
        <div class="game-card-mini">
            <div class="mini-thumb"><i class="fa-solid fa-basketball"></i></div>
            <h5>Hoops</h5>
            <p><i class="fa-solid fa-bolt"></i> +300</p>
        </div>
        <div class="game-card-mini">
            <div class="mini-thumb"><i class="fa-solid fa-snake"></i></div>
            <h5>Snake</h5>
            <p><i class="fa-solid fa-bolt"></i> +330</p>
        </div>
        <div class="game-card-mini">
            <div class="mini-thumb"><i class="fa-solid fa-cubes"></i></div>
            <h5>Stack Tower</h5>
            <p><i class="fa-solid fa-bolt"></i> +250</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="../tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="arcade.html" class="nav-item active">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../profile/index.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <!-- Linked to Earn Folder's Centralized Aura JS -->
    <script src="aura.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.body.style.opacity = "1";
        });

        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
