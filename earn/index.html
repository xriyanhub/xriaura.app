<!DOCTYPE html>
<html lang="en" style="background-color: #12100e;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Earn Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        html, body {
            background-color: #12100e !important;
            color: #ffffff;
        }

        body {
            padding: 16px;
            padding-bottom: 90px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 18px;
            font-weight: 900;
        }

        .earn-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .earn-card {
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: 0.2s;
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .card-info h3 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .card-info p {
            font-size: 12px;
        }

        .card-arrow {
            font-size: 14px;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="main-title" id="earnTitle"><i class="fa-solid fa-rotate"></i> Earn Hub</div>
    </div>

    <div class="earn-grid">
        <a href="arcade.html" class="earn-card">
            <div class="card-left">
                <div class="card-icon"><i class="fa-solid fa-gamepad"></i></div>
                <div class="card-info">
                    <h3>Arcade Games</h3>
                    <p>Play & earn WAVES instantly</p>
                </div>
            </div>
            <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
        </a>

        <a href="spin.html" class="earn-card">
            <div class="card-left">
                <div class="card-icon"><i class="fa-solid fa-circle-notch"></i></div>
                <div class="card-info" id="spinCardInfo">
                    <h3>Lucky Spin</h3>
                    <p id="spinLimitText">Spin the wheel for daily prizes</p>
                </div>
            </div>
            <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
        </a>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="../tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="../refer/index.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="../profile/index.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <!-- External Earn Aura JS Controller -->
    <script src="aura.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBy2MFbE-B3VcD1GjbdRUds_IH_DcQKczo",
            authDomain: "xriaura.firebaseapp.com",
            databaseURL: "https://xriaura-default-rtdb.firebaseio.com",
            projectId: "xriaura",
            storageBucket: "xriaura.firebasestorage.app",
            messagingSenderId: "937962536194",
            appId: "1:937962536194:web:a5b024c230d50a7b58d61b",
            measurementId: "G-F2W224J9CY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref("admin/homeSettings").on("value", (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                const limitText = document.getElementById('spinLimitText');
                if (data.spinLimit && limitText) {
                    limitText.innerText = `Daily Free Spins Limit: ${data.spinLimit}`;
                }
            }
        });
    </script>
</body>
</html>
