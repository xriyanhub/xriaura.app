<!DOCTYPE html>
<html lang="en" style="background-color: #12100e;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Withdraw Funds</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        html, body {
            background-color: #12100e !important;
            color: #ffffff;
        }

        body {
            padding: 16px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        /* Top Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 800;
        }

        /* Balance Display Box */
        .balance-box {
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 12px;
            margin-bottom: 6px;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: 900;
        }

        /* Form Card */
        .form-card {
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .input-label {
            font-size: 11px;
            margin-bottom: 6px;
            display: block;
        }

        .withdraw-input {
            background: transparent;
            border: none;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            outline: none;
            color: #ffffff;
        }

        .notice {
            font-size: 11px;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="header-title">Withdraw USDT</div>
        <div style="width: 36px;"></div>
    </div>

    <!-- Balance Box -->
    <div class="balance-box">
        <div class="balance-label">Available Balance</div>
        <div class="balance-amount">0.00049 USDT</div>
    </div>

    <!-- Notice -->
    <div class="notice">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>Minimum withdrawal amount is 5.00 USDT.</span>
    </div>

    <!-- Form Card -->
    <div class="form-card">
        <div class="input-group">
            <span class="input-label">TON / USDT Wallet Address</span>
            <input type="text" placeholder="Paste your wallet address (EQ...)" class="withdraw-input">
        </div>

        <div class="input-group">
            <span class="input-label">Amount to Withdraw</span>
            <input type="number" placeholder="0.00" class="withdraw-input">
        </div>
    </div>

    <!-- Withdraw Button -->
    <button class="submit-btn">Request Withdrawal</button>

    <!-- Linked to Home Folder's Centralized Aura JS -->
    <script src="aura.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.body.style.opacity = "1";
        });

        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
