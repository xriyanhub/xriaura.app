<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Lucky Spin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .header-top {
            width: 100%;
            margin-bottom: 20px;
            text-align: left;
        }

        .subtitle {
            font-size: 11px;
            color: #ffb703;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .main-title {
            font-size: 22px;
            font-weight: 900;
        }

        /* Wheel Container */
        .wheel-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 30px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ffb703 0deg 60deg,
                #1c1c1c 60deg 120deg,
                #ffb703 120deg 180deg,
                #222 180deg 240deg,
                #ffb703 240deg 300deg,
                #141414 300deg 360deg
            );
            border: 6px solid #2a2a2a;
            box-shadow: 0 0 20px rgba(255, 183, 3, 0.2);
            position: relative;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .wheel-center {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #111;
            border: 4px solid #ffb703;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #ffb703;
            z-index: 10;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #ffb703;
            z-index: 15;
        }

        .spin-btn {
            background: #ffb703;
            color: #000;
            border: none;
            padding: 14px 40px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.3);
            width: 80%;
            max-width: 280px;
        }

        .spin-info {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 16px;
        }

        .nav-item.active {
            color: #ffb703;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="subtitle"><i class="fa-solid fa-bolt"></i> Daily Bonus</div>
        <div class="main-title">Lucky Spin</div>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <div class="wheel-center"><i class="fa-solid fa-bolt"></i></div>
        </div>
    </div>

    <button class="spin-btn" onclick="spinWheel()">SPIN NOW</button>
    <div class="spin-info" id="spinInfo">Free spin available!</div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="../index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="../tasks/index.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="spin.html" class="nav-item active">
            <i class="fa-solid fa-rotate"></i>
            <span>Earn</span>
        </a>
        <a href="bio.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="convert.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let isSpinning = false;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            
            const wheel = document.getElementById('wheel');
            const info = document.getElementById('spinInfo');
            info.innerText = "Spinning...";

            const randomDegree = Math.floor(Math.random * 360) + 1800; // At least 5 full rotations
            wheel.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                isSpinning = false;
                info.innerText = "You won +250 WAVES!";
                alert("Congratulations! You won 250 WAVES.");
            }, 4000);
        }
    </script>
</body>
</html>
