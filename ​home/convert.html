<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Convert WAVES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            padding: 16px;
        }

        /* Top Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #181818;
            border: 1px solid #282828;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 800;
        }

        /* Convert Card */
        .convert-card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .input-label {
            font-size: 11px;
            color: #777;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .convert-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            width: 60%;
            outline: none;
        }

        .currency-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1c1c1c;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            color: #ffb703;
        }

        .currency-badge.usdt {
            color: #2ed573;
        }

        /* Swap Icon Divider */
        .swap-divider {
            display: flex;
            justify-content: center;
            margin: -6px 0;
            position: relative;
            z-index: 10;
        }

        .swap-icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #ffb703;
            color: #000;
            border: 3px solid #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
        }

        .rate-info {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-top: 16px;
        }

        /* Convert Action Button */
        .submit-btn {
            width: 100%;
            background: #ffb703;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="header-title">Convert WAVES</div>
        <div style="width: 36px;"></div>
    </div>

    <!-- Convert Interface -->
    <div class="convert-card">
        <!-- From Box -->
        <div class="input-group">
            <div class="input-label">
                <span>From</span>
                <span>Balance: 49 WAVES</span>
            </div>
            <div class="input-wrapper">
                <input type="number" value="49" class="convert-input" id="from-amount">
                <div class="currency-badge">
                    <i class="fa-solid fa-bolt" style="color: #ffb703;"><span>WAVES</span></i>
                </div>
            </div>
        </div>

        <!-- Swap Divider -->
        <div class="swap-divider">
            <div class="swap-icon-btn"><i class="fa-solid fa-arrow-right-arrow-left"></i></div>
        </div>

        <!-- To Box -->
        <div class="input-group" style="margin-top: 12px;">
            <div class="input-label">
                <span>To (Estimated)</span>
                <span>USDT Network</span>
            </div>
            <div class="input-wrapper">
                <input type="text" value="0.00049" class="convert-input" id="to-amount" readonly>
                <div class="currency-badge usdt">
                    <i class="fa-solid fa-circle-dollar-to-slot"></i> USDT
                </div>
            </div>
        </div>

        <div class="rate-info">1 WAVE = 0.00001 USDT • Fee: 0%</div>
    </div>

    <!-- Convert Button -->
    <button class="submit-btn">Convert Now</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
