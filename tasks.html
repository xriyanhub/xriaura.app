<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XriAura - Tasks</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
        }

        /* Top Header */
        .sub-header {
            font-size: 11px;
            color: #ffb703;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
        }

        .main-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .sub-title {
            font-size: 13px;
            color: #888888;
            margin-bottom: 20px;
        }

        /* Category Tabs Section */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .cat-icon-box {
            position: relative;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #181818;
            border: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #ffb703;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .cat-item.active .cat-icon-box {
            background: #ffb703;
            color: #000000;
            border-color: #ffb703;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.4);
        }

        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ff4757;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            border: 2px solid #0d0d0d;
        }

        .cat-label-btn {
            background: transparent;
            border: none;
            color: #aaaaaa;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .cat-item.active .cat-label-btn {
            background: #ffb703;
            color: #000000;
            font-weight: bold;
        }

        /* Sub-navigation for Exclusive Tab */
        .sub-tab-container {
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 8px;
        }

        .sub-tab-group {
            display: flex;
            background: #141414;
            border: 1px solid #242424;
            padding: 4px;
            border-radius: 14px;
            flex: 1;
        }

        .sub-tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: #888;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
        }

        .sub-tab-btn.active {
            background: #222;
            color: #fff;
        }

        .add-task-btn {
            background: #ffb703;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        /* Sponsored Banner (For Daily Tab) */
        .sponsored-card {
            display: none;
            background: linear-gradient(135deg, #1f142e, #120e1a);
            border: 1px solid #3d2459;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .sponsored-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .sponsored-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .sponsored-tag {
            background: rgba(165, 94, 234, 0.2);
            color: #a55eea;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 600;
        }

        .sponsored-reward {
            background: rgba(255, 183, 3, 0.1);
            color: #ffb703;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Promote Link Card (Exclusive / My Tasks) */
        .promote-card {
            display: none;
            background: #141414;
            border: 1px solid #242424;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .promote-icon {
            font-size: 40px;
            color: #ffb703;
            margin-bottom: 12px;
        }

        .promote-card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .promote-card p {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        .create-task-btn {
            background: #ffb703;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
        }

        /* Section Header */
        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .tasks-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tasks-title span {
            color: #ffb703;
            font-weight: bold;
        }

        .tasks-progress {
            font-size: 12px;
            color: #888888;
        }

        /* Task Cards */
        .task-card {
            background: #141414;
            border: 1px solid #242424;
            border-radius: 18px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .task-info h4 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .task-info p {
            font-size: 11px;
            color: #777777;
            margin-bottom: 6px;
        }

        .task-reward {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 183, 3, 0.1);
            color: #ffb703;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .start-btn {
            background: #ffb703;
            color: #000000;
            border: none;
            padding: 9px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 183, 3, 0.2);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: #111111;
            border-top: 1px solid #222222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #666666;
            text-decoration: none;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: #ffb703;
        }

        .nav-item.center-btn {
            position: relative;
            top: -15px;
        }

        .center-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ffb703;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 4px solid #0d0d0d;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.4);
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="sub-header">
        <i class="fa-solid fa-bolt"></i> COMPLETE & COLLECT
    </div>
    <div class="main-title">Tasks</div>
    <div class="sub-title">Complete tasks, collect WAVES</div>

    <!-- Main Category Tabs -->
    <div class="category-grid">
        <div class="cat-item active" onclick="switchCategory('social', this)">
            <div class="cat-icon-box">
                <i class="fa-solid fa-bullhorn"></i>
                <span class="badge">4</span>
            </div>
            <button class="cat-label-btn">Social</button>
        </div>
        <div class="cat-item" onclick="switchCategory('daily', this)">
            <div class="cat-icon-box">
                <i class="fa-solid fa-calendar-days"></i>
                <span class="badge">7</span>
            </div>
            <button class="cat-label-btn">Daily</button>
        </div>
        <div class="cat-item" onclick="switchCategory('exclusive', this)">
            <div class="cat-icon-box">
                <i class="fa-solid fa-gem"></i>
                <span class="badge">2</span>
            </div>
            <button class="cat-label-btn">Exclusive</button>
        </div>
        <div class="cat-item" onclick="switchCategory('partner', this)">
            <div class="cat-icon-box">
                <i class="fa-solid fa-handshake"></i>
                <span class="badge">22</span>
            </div>
            <button class="cat-label-btn">Partner</button>
        </div>
    </div>

    <!-- Sub Navigation for Exclusive Tab -->
    <div class="sub-tab-container" id="exclusive-sub-tabs">
        <div class="sub-tab-group">
            <button class="sub-tab-btn active" onclick="switchExclusiveSubTab('tasks', this)">Tasks</button>
            <button class="sub-tab-btn" onclick="switchExclusiveSubTab('mytasks', this)">My tasks</button>
        </div>
        <button class="add-task-btn"><i class="fa-solid fa-plus"></i> Add task</button>
    </div>

    <!-- Sponsored Banner -->
    <div class="sponsored-card" id="sponsored-banner">
        <div class="sponsored-header">
            <div class="sponsored-title"><i class="fa-solid fa-bullhorn" style="color: #a55eea;"></i> Sponsored tasks</div>
            <span class="sponsored-tag">AdsGram</span>
        </div>
        <p style="font-size: 11px; color: #aaa; margin-bottom: 12px;">Complete a partner task and earn 60 WAVES</p>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="sponsored-reward"><i class="fa-solid fa-bolt"></i> +60</div>
            <button class="start-btn">Start</button>
        </div>
    </div>

    <!-- Promote Card (My Tasks View) -->
    <div class="promote-card" id="promote-card">
        <div class="promote-icon"><i class="fa-solid fa-cloud-bolt"></i></div>
        <h3>Promote your channel or link</h3>
        <p>Create a task, pay in TON, and real users complete it for WAVES.</p>
        <button class="create-task-btn">+ Create task</button>
    </div>

    <!-- Dynamic Section Title -->
    <div class="tasks-header" id="tasks-header">
        <div class="tasks-title">
            <span>|</span> <span id="current-cat-title">Social</span>
        </div>
        <div class="tasks-progress" id="current-cat-progress">0/4 done</div>
    </div>

    <!-- Dynamic Task List Container -->
    <div id="task-list-container">
        <!-- Dynamic Tasks will render here -->
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="tasks.html" class="nav-item active">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </a>
        <a href="#" class="nav-item center-btn">
            <div class="center-circle">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <span>Earn</span>
        </a>
        <a href="frends.html" class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>Refer</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const allTasks = {
            social: [
                { title: 'Join announcement channel', desc: 'Get news, drops and announ...', reward: '+150', icon: 'fa-bolt', color: '#38ef7d', btn: 'Start' },
                { title: 'Join the community chat', desc: 'Join official ThunderWaves C...', reward: '+150', icon: 'fa-comments', color: '#0088cc', btn: 'Start' },
                { title: 'Mystery Airdrops', desc: 'Join our partner telegram ch...', reward: '+100', icon: 'fa-parachute-box', color: '#a55eea', btn: 'Start' },
                { title: 'All earnings BD', desc: 'Join our partner telegram ch...', reward: '+100', icon: 'fa-globe', color: '#ffb703', btn: 'Start' }
            ],
            daily: [
                { title: 'Adsgram', desc: 'Watch Adsgram ad and earn ...', reward: '+1,150', icon: 'fa-play', color: '#0088cc', btn: '▶ 0/15' },
                { title: 'Monetag', desc: 'Watch monetag ads and earn...', reward: '+385', icon: 'fa-rectangle-ad', color: '#2ed573', btn: '▶ 0/8' },
                { title: 'GigaPub', desc: 'Watch Gigapub Ads and earn...', reward: '+645', icon: 'fa-tv', color: '#ff4757', btn: '▶ 0/10' }
            ],
            exclusive: [
                { title: 'Open Free Case', desc: 'Open a free case on Epic Gift...', reward: '+200', icon: 'fa-box-open', color: '#ffb703', btn: 'Start', extra: '2,822 spots left' },
                { title: 'AR INCOME BD', desc: 'Join the channel', reward: '+150', icon: 'fa-bullhorn', color: '#ff4757', btn: 'Start' }
            ],
            partner: [
                { title: 'RG Crypto Lab', desc: 'Join our partner telegram ch...', reward: '+75', icon: 'fa-flask', color: '#ff4757', btn: 'Start' },
                { title: 'PokerGram', desc: 'Join Pokergram & Grab your ...', reward: '+75', icon: 'fa-dice', color: '#e1306c', btn: 'Start' },
                { title: 'Twitter', desc: 'Follow our partner on twitter', reward: '+75', icon: 'fa-brands fa-x-twitter', color: '#fff', btn: 'Start' },
                { title: 'YouTube', desc: 'Like, Subscribe & Comment...', reward: '+75', icon: 'fa-brands fa-youtube', color: '#ff0000', btn: 'Start' }
            ]
        };

        function renderTasks(category) {
            const container = document.getElementById('task-list-container');
            container.innerHTML = '';

            const tasks = allTasks[category] || [];
            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'task-card';
                card.innerHTML = `
                    <div class="task-left">
                        <div class="task-icon" style="color: ${task.color};">
                            <i class="fa-solid ${task.icon}"></i>
                        </div>
                        <div class="task-info">
                            <h4>${task.title}</h4>
                            <p>${task.desc}</p>
                            <div style="display: flex; gap: 6px; align-items: center;">
                                <div class="task-reward"><i class="fa-solid fa-bolt"></i> ${task.reward}</div>
                                ${task.extra ? `<span style="font-size:10px; color:#ff4757;">${task.extra}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <button class="start-btn">${task.btn}</button>
                `;
                container.appendChild(card);
            });
        }

        function switchCategory(cat, el) {
            document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');

            // Hide special layouts
            document.getElementById('exclusive-sub-tabs').style.display = 'none';
            document.getElementById('sponsored-banner').style.display = 'none';
            document.getElementById('promote-card').style.display = 'none';
            document.getElementById('tasks-header').style.display = 'flex';

            document.getElementById('current-cat-title').innerText = cat.charAt(0).toUpperCase() + cat.slice(1);
            
            if(cat === 'social') {
                document.getElementById('current-cat-progress').innerText = '0/4 done';
            } else if(cat === 'daily') {
                document.getElementById('sponsored-banner').style.display = 'block';
                document.getElementById('current-cat-progress').innerText = '0/7 done';
            } else if(cat === 'exclusive') {
                document.getElementById('exclusive-sub-tabs').style.display = 'flex';
                document.getElementById('current-cat-progress').innerText = '0/2 done';
            } else if(cat === 'partner') {
                document.getElementById('current-cat-progress').innerText = '0/22 done';
            }

            renderTasks(cat);
        }

        function switchExclusiveSubTab(type, el) {
            document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

            if(type === 'mytasks') {
                document.getElementById('tasks-header').style.display = 'none';
                document.getElementById('task-list-container').innerHTML = '';
                document.getElementById('promote-card').style.display = 'block';
            } else {
                document.getElementById('promote-card').style.display = 'none';
                document.getElementById('tasks-header').style.display = 'flex';
                renderTasks('exclusive');
            }
        }

        // Initial Load
        renderTasks('social');
    </script>
</body>
</html>
